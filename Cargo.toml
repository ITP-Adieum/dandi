[workspace]
resolver = "2"
members = [
    "crates/dandi-core",
    "crates/dandi-cli",
    "crates/dandi-eval",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/ITP-Adieum/dandi"

[workspace.dependencies]
bzip2 = "0.6"
chardetng = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.4"
encoding_rs = "0.8"
filetime = "0.2"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
lzma-rust2 = { version = "0.26", features = ["std", "xz", "encoder"] }
proptest = "1.6"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = "0.27"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.15"
thiserror = "2.0"
time = "0.3"
unicode-normalization = "0.1"
walkdir = "2.5"
zip = { version = "9.8", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2-zlib-rs", "deflate64", "lzma", "ppmd", "time", "xz", "zstd"] }
zstd = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
