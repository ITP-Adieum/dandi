<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="160" y1="96" x2="864" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#272C36" />
      <stop offset="100%" stop-color="#14171D" />
    </linearGradient>
    <linearGradient id="cloth-main" x1="250" y1="220" x2="770" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF8F3" />
      <stop offset="100%" stop-color="#E7E2D8" />
    </linearGradient>
    <linearGradient id="cloth-fold" x1="520" y1="220" x2="776" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D7D1C5" />
      <stop offset="100%" stop-color="#C5BEB0" />
    </linearGradient>
    <linearGradient id="seal" x1="560" y1="432" x2="784" y2="592" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EA623E" />
      <stop offset="100%" stop-color="#C9411F" />
    </linearGradient>
    <filter id="soft-shadow" x="180" y="180" width="680" height="690" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#090B0E" flood-opacity="0.42" />
    </filter>
  </defs>

  <!-- macOS/Windows squircle chassis -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)" />
  <rect x="72" y="72" width="880" height="880" rx="200" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="6" />

  <!-- Geometric folded parcel forming a crisp architectural 'D' -->
  <g filter="url(#soft-shadow)">
    <!-- Primary folded 'D' cloth body -->
    <path
      d="M276 232H516C666 232 764 334 764 512C764 690 666 792 516 792H276C256 792 240 776 240 756V268C240 248 256 232 276 232Z"
      fill="url(#cloth-main)"
    />

    <!-- Diagonal bojagi fold facet on upper-right curve -->
    <path
      d="M516 232C666 232 764 334 764 512H516V232Z"
      fill="url(#cloth-fold)"
    />

    <!-- Clean geometric interior cutout (forms crisp 'D' counter) -->
    <path
      d="M388 364H504C582 364 624 418 624 512C624 606 582 660 504 660H388V364Z"
      fill="#1A1E26"
    />

    <!-- Fold crease hairline -->
    <path d="M516 232V364" stroke="#1A1E26" stroke-opacity="0.16" stroke-width="8" />
    <path d="M240 512H388" stroke="#1A1E26" stroke-opacity="0.12" stroke-width="8" />

    <!-- Signature warm vermilion clasp / tie ("단디" locked tight) -->
    <rect x="572" y="454" width="212" height="116" rx="58" fill="url(#seal)" />
    <circle cx="726" cy="512" r="24" fill="#FAF8F3" />
  </g>
</svg>
