[package]
name = "dandi-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Dandi cross-platform desktop GUI (Tauri v2 thin shell over dandi-core)"
repository = "https://github.com/ITP-Adieum/dandi"

[lib]
name = "dandi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dandi-core = { path = "../../../crates/dandi-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
