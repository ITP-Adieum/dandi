name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --all --check
      - name: Check desktop backend formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  test-and-eval:
    name: Core Clippy, Test & Eval (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit & Integration Tests
        run: cargo test --workspace
      - name: Run 100-Point Eval Harness
        run: cargo run --release -p dandi-eval
      - name: Upload Eval Scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.os }}
          path: |
            eval-report.md
            eval-report.json

  desktop-frontend:
    name: Desktop Frontend (Typecheck, Vitest, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm --dir apps/desktop exec tsc --noEmit
      - name: Vitest unit tests
        run: pnpm --dir apps/desktop test
      - name: Vite production build
        run: pnpm --dir apps/desktop build

  desktop-tauri-build:
    name: Desktop Tauri Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/release/bundle/macos/*.app
          - os: windows-latest
            bundles: msi,nsis
            artifact_paths: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile
      - name: Build frontend assets
        run: pnpm --dir apps/desktop build
      - name: Clippy (src-tauri)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust unit tests (src-tauri)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Tauri Desktop Bundle (${{ matrix.bundles }})
        run: pnpm --dir apps/desktop tauri build --bundles ${{ matrix.bundles }}
      - name: Upload Desktop Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dandi-desktop-${{ matrix.os }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
